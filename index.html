<!doctype html>
<html lang="en" data-theme="atlas">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crosscountry</title>
  <script>
    // Apply the saved theme before first paint.
    try {
      const theme = JSON.parse(localStorage.getItem("crosscountry.theme"));
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;900&family=IM+Fell+English&family=JetBrains+Mono:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -20 40 40'%3E%3Ccircle r='19' fill='%23ece3cd'/%3E%3Cpath d='M0-9 3-3 9 0 3 3 0 9-3 3-9 0-3-3Z' transform='rotate(45)' fill='%232c5a70'/%3E%3Cpath d='M0-19 4-4 0 0Z M19 0 4 4 0 0Z M0 19-4 4 0 0Z M-19 0-4-4 0 0Z' fill='%23b23a26'/%3E%3Cpath d='M0-19-4-4 0 0Z M19 0 4-4 0 0Z M0 19 4 4 0 0Z M-19 0-4 4 0 0Z' fill='%232a2622'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <svg class="logo" viewBox="-20 -20 40 40" width="32" height="32" aria-hidden="true">
        <circle class="ring" r="13" fill="none" stroke-width="0.9"/>
        <path class="minor" d="M0-9 3-3 9 0 3 3 0 9-3 3-9 0-3-3Z" transform="rotate(45)"/>
        <path class="light" d="M0-19 4-4 0 0Z M19 0 4 4 0 0Z M0 19-4 4 0 0Z M-19 0-4-4 0 0Z"/>
        <path class="dark" d="M0-19-4-4 0 0Z M19 0 4-4 0 0Z M0 19 4 4 0 0Z M-19 0-4 4 0 0Z"/>
      </svg>
      <h1>Crosscountry</h1>
      <div class="status">
        <span id="guesses"></span>
        <span id="score"></span>
      </div>
      <button id="help-open" class="gear" aria-label="How criteria are counted">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5"/>
          <path d="M9.2 9.2a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.4-2.8 4.1"/>
          <path d="M12 17.6v.1"/>
        </svg>
      </button>
      <button id="gear" class="gear" aria-label="Options" aria-expanded="false" aria-controls="options">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <div id="options" class="options" hidden>
        <fieldset id="themes">
          <legend>Theme</legend>
        </fieldset>
      </div>
    </header>

    <nav class="days" aria-label="Day">
      <button id="prev-day" aria-label="Previous day">←</button>
      <span id="day"></span>
      <button id="next-day" aria-label="Next day">→</button>
      <button id="to-today" class="today">Today</button>
    </nav>

    <div id="board" class="board"></div>

    <p class="legend" aria-label="Cell colours, from common to rare answers">common <i class="tier-common"></i><i class="tier-mid"></i><i class="tier-rare"></i> rare</p>

    <div id="entry" class="entry">
      <input id="guess" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Pick a cell, then type a country">
      <ul id="suggestions" class="suggestions"></ul>
    </div>

    <p id="message" class="message"></p>

    <div class="actions">
      <button id="give-up">Give up</button>
      <button id="share">Share result</button>
    </div>

    <p class="hint">↑↓←→ move · ⏎ guess</p>

    <section id="answers" class="answers" hidden></section>
  </main>

  <dialog id="help" class="help" aria-labelledby="help-title">
    <div class="help-head">
      <h2 id="help-title">How criteria are counted</h2>
      <button id="help-close" class="gear" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <input id="help-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search criteria, e.g. flag, desert, capital">
    <p id="help-intro" class="help-intro"></p>
    <div id="help-list" class="help-list"></div>
  </dialog>
  <script type="module" src="src/app.js"></script>
</body>
</html>
